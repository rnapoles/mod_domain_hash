services:
  apache:
    build: .
    container_name: mod_domain_hash_test
    ports:
      - "8085:80"
    volumes:
      - ./mod_domain_hash.c:/build/mod_domain_hash.c:ro
      - ./var/sites/:/var/sites/
      - ./var/redirector/:/var/redirector/
      - ./var/www/:/var/www/
    environment:
      - APACHE_LOG_DIR=/var/log/apache2
    stdin_open: true
    tty: true