<VirtualHost *:80>

    DomainHashEnable On
    DomainHashBase /var/sites/sites1
    DomainHashBase /var/sites/sites2
    
    RedirectMap /var/redirector/rules-map.txt
    RedirectMapRoot /var/redirector

    UseCanonicalName Off

    # This applies to ALL hashed directories
    <Directory /var/sites>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <Directory /var/redirector>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    LogLevel info domain_hash:debug
</VirtualHost>

<VirtualHost *:80>
    DocumentRoot "/var/www/example1"
    ServerName www.example1.com

    <Directory /var/www/example1>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

</VirtualHost>

<VirtualHost *:80>
    DocumentRoot "/var/www/example2"
    ServerName www.example2.com

    <Directory /var/www/example2>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

</VirtualHost>

<VirtualHost *:80>
    DocumentRoot "/var/redirector"
    ServerName www.example3.com

    <Directory /var/redirector>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>





